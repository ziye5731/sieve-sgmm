name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[study,dev]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check . && ruff format --check .
      - run: python -m build
      - run: python -m experiments.study --smoke --jobs 1 --output results/ci-smoke
      - name: Keep smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics-${{ matrix.python }}
          path: results/ci-smoke
  numpy-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_estimator.py -v
      - run: python examples/linear_iv.py && python examples/nonlinear_iv.py
