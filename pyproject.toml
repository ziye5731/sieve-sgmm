[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-sgmm"
version = "0.1.0"
description = "Streaming sieve GMM for nonlinear instrumental variable regression"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ziye Zhang"}]
dependencies = ["numpy>=1.24"]
keywords = ["instrumental-variables", "gmm", "streaming", "stochastic-approximation", "causal-inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
study = ["matplotlib>=3.7", "numba>=0.61", "scipy>=1.11"]
dev = ["build>=1.2", "ruff>=0.11"]

[project.urls]
Homepage = "https://ziye5731.github.io/posts/2026/10/sieve-sgmm/"
Repository = "https://github.com/ziye5731/sieve-sgmm"
Issues = "https://github.com/ziye5731/sieve-sgmm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
